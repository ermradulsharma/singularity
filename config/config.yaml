model:
  vocab_size: 200019      # 200k Ideal Frontier Vocabulary (GPT-4o Native & Tensor Core Aligned)
  n_embd: 16384           # 1 Trillion+ Parameter Frontier Embedding Dimension
  n_head: 128             # 128 Attention Heads
  n_kv_head: 16           # 16 Key/Value Heads (Grouped-Query Attention)
  n_layer: 128            # 128 Deep Transformer Layers
  block_size: 1048576     # 1 Million Token (1M) Infinite Context Window
  num_experts: 512        # 512 Fine-Grained MoE Experts (DeepSeek-V3 / Singularity 1T Topology)
  num_experts_per_tok: 8  # Top-8 Active Expert Routing per Token
  dropout: 0.0
  
  vision:
    image_size: 896       # Ultra High-Res Omni Vision Resolution
    patch_size: 14
    in_channels: 3

training:
  batch_size: 1
  learning_rate: 0.0001
  max_iters: 1000000
  eval_interval: 1000
  eval_iters: 100
  accumulation_steps: 64
  device: "cuda"

paths:
  hf_dataset_name: "omni_science_1t" 
  model_save: "models/singularity_1t_frontier.safetensors"


